name: socialfeed
description: Aplicativo Flutter SocialFeed para acompanhar feeds, stories e posts do TikTok, Instagram e X.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  http: ^1.2.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  xml: ^6.6.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/socialfeed.png

flutter_launcher_icons:
  image_path: assets/icon/socialfeed.png
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
