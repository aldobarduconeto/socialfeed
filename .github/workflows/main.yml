name: Build & Release SocialFeed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. ANDROID (APK) & LINUX (DEB)
  # ==========================================
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build APK
      - name: Build Android APK
        run: |
          flutter build apk --release
          APK_FILE=$(find build/app/outputs -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" socialfeed-android.apk
          else
            cp build/app/outputs/flutter-apk/app-release.apk socialfeed-android.apk
          fi
          ls -la socialfeed-android.apk

      # Build Linux Desktop & Package .deb
      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux .deb
        run: |
          APP_NAME="socialfeed"
          # 1. Obtém versão válida do pubspec.yaml
          PUBSPEC_VER=$(grep -m 1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/' | tr -d '[:space:]')
          [ -z "$PUBSPEC_VER" ] && PUBSPEC_VER="1.0.0"

          # 2. Se a ref for uma tag que inicia com número (ex: v1.0.0 -> 1.0.0), usa a tag; se for branch (ex: main), usa do pubspec
          TAG_CLEAN="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_CLEAN" =~ ^[0-9] ]]; then
            VERSION=$(echo "$TAG_CLEAN" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
          else
            VERSION="$PUBSPEC_VER"
          fi

          # Garantia estrita para formato Debian: Version DEVE começar com dígito
          if [[ ! "$VERSION" =~ ^[0-9] ]]; then
            VERSION="1.0.0"
          fi

          ARCH="amd64"
          STAGE_DIR="deb-package/${APP_NAME}_${VERSION}_${ARCH}"

          mkdir -p "$STAGE_DIR/usr/bin"
          mkdir -p "$STAGE_DIR/usr/lib/$APP_NAME"
          mkdir -p "$STAGE_DIR/usr/share/applications"
          mkdir -p "$STAGE_DIR/DEBIAN"

          cp -r build/linux/x64/release/bundle/* "$STAGE_DIR/usr/lib/$APP_NAME/"
          ln -s "/usr/lib/$APP_NAME/$APP_NAME" "$STAGE_DIR/usr/bin/$APP_NAME"

          cat <<EOF > "$STAGE_DIR/DEBIAN/control"
          Package: $APP_NAME
          Version: $VERSION
          Architecture: $ARCH
          Maintainer: Aldo Barduco Neto
          Description: SocialFeed application
          EOF

          cat <<EOF > "$STAGE_DIR/usr/share/applications/$APP_NAME.desktop"
          [Desktop Entry]
          Name=SocialFeed
          Exec=/usr/bin/$APP_NAME
          Terminal=false
          Type=Application
          Categories=Network;Social;
          EOF

          dpkg-deb --build "$STAGE_DIR"
          mv "deb-package/${APP_NAME}_${VERSION}_${ARCH}.deb" socialfeed-linux.deb

      - name: Upload Artifacts (Ubuntu)
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts
          path: |
            socialfeed-android.apk
            socialfeed-linux.deb

  # ==========================================
  # 2. WINDOWS (EXE com Inno Setup)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create Inno Setup Script & Compile Installer
        shell: pwsh
        run: |
          $issContent = @"
          [Setup]
          AppName=SocialFeed
          AppVersion=1.0.0
          DefaultDirName={autopf}\SocialFeed
          DefaultGroupName=SocialFeed
          OutputDir=.
          OutputBaseFilename=SocialFeed-Setup
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\SocialFeed"; Filename: "{app}\socialfeed.exe"
          Name: "{autodesktop}\SocialFeed"; Filename: "{app}\socialfeed.exe"
          "@
          Set-Content -Path "installer.iss" -Value $issContent
          ISCC.exe installer.iss

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: SocialFeed-Setup.exe

  # ==========================================
  # 3. MACOS & IOS (DMG e IPA)
  # ==========================================
  build-macos-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build macOS & DMG
      - name: Build macOS Desktop
        run: flutter build macos --release

      - name: Create DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH="build/macos/Build/Products/Release/socialfeed.app"
          fi
          mkdir -p dmg_temp
          cp -R "$APP_PATH" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "SocialFeed" -srcfolder dmg_temp -ov -format UDZO socialfeed-macos.dmg
          rm -rf dmg_temp
          ls -lh socialfeed-macos.dmg

      # Build iOS IPA (unsigned payload)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 socialfeed-ios.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts (macOS & iOS)
        uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts
          path: |
            socialfeed-macos.dmg
            socialfeed-ios.ipa

  # ==========================================
  # 4. PUBLISH TO GITHUB RELEASES
  # ==========================================
  release:
    needs: [build-ubuntu, build-windows, build-macos-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Tag
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] || [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9]+(\.[0-9]+)* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/' | tr -d '[:space:]')
            TAG="v${VER:-1.0.0}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Standardize Filenames
        run: |
          cd release_assets
          # Procura por qualquer APK baixado e normaliza para socialfeed-android.apk
          APK_FOUND=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_FOUND" ] && [ "$APK_FOUND" != "./socialfeed-android.apk" ]; then
            mv "$APK_FOUND" socialfeed-android.apk
          fi
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/socialfeed-android.apk
            release_assets/socialfeed-linux.deb
            release_assets/SocialFeed-Setup.exe
            release_assets/socialfeed-macos.dmg
            release_assets/socialfeed-ios.ipa
