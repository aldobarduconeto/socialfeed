name: Build & Release SocialFeed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. ANDROID (APK) & LINUX (DEB)
  # ==========================================
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build APK
      - name: Build Android APK
        run: flutter build apk --release

      # Build Linux Desktop & Package .deb
      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux .deb
        run: |
          APP_NAME="socialfeed"
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "" ] && VERSION="1.0.0"
          ARCH="amd64"
          STAGE_DIR="deb-package/${APP_NAME}_${VERSION}_${ARCH}"

          mkdir -p "$STAGE_DIR/usr/bin"
          mkdir -p "$STAGE_DIR/usr/lib/$APP_NAME"
          mkdir -p "$STAGE_DIR/usr/share/applications"
          mkdir -p "$STAGE_DIR/DEBIAN"

          cp -r build/linux/x64/release/bundle/* "$STAGE_DIR/usr/lib/$APP_NAME/"
          ln -s "/usr/lib/$APP_NAME/$APP_NAME" "$STAGE_DIR/usr/bin/$APP_NAME"

          cat <<EOF > "$STAGE_DIR/DEBIAN/control"
          Package: $APP_NAME
          Version: $VERSION
          Architecture: $ARCH
          Maintainer: Aldo Barduco Neto
          Description: SocialFeed application
          EOF

          cat <<EOF > "$STAGE_DIR/usr/share/applications/$APP_NAME.desktop"
          [Desktop Entry]
          Name=SocialFeed
          Exec=/usr/bin/$APP_NAME
          Terminal=false
          Type=Application
          Categories=Network;Social;
          EOF

          dpkg-deb --build "$STAGE_DIR"
          mv "deb-package/${APP_NAME}_${VERSION}_${ARCH}.deb" socialfeed-linux.deb

      - name: Upload Artifacts (Ubuntu)
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            socialfeed-linux.deb

  # ==========================================
  # 2. WINDOWS (EXE com Inno Setup)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create Inno Setup Script & Compile Installer
        shell: pwsh
        run: |
          $issContent = @"
          [Setup]
          AppName=SocialFeed
          AppVersion=1.0.0
          DefaultDirName={autopf}\SocialFeed
          DefaultGroupName=SocialFeed
          OutputDir=.
          OutputBaseFilename=SocialFeed-Setup
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\SocialFeed"; Filename: "{app}\socialfeed.exe"
          Name: "{autodesktop}\SocialFeed"; Filename: "{app}\socialfeed.exe"
          "@
          Set-Content -Path "installer.iss" -Value $issContent
          ISCC.exe installer.iss

      - name: Upload Artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: SocialFeed-Setup.exe

  # ==========================================
  # 3. MACOS & IOS (DMG e IPA)
  # ==========================================
  build-macos-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Build macOS & DMG
      - name: Build macOS Desktop
        run: flutter build macos --release

      - name: Create DMG
        run: |
          npm install --global create-dmg
          create-dmg "build/macos/Build/Products/Release/socialfeed.app" . || true
          mv *.dmg socialfeed-macos.dmg

      # Build iOS IPA (unsigned payload)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 socialfeed-ios.ipa Payload
          rm -rf Payload

      - name: Upload Artifacts (macOS & iOS)
        uses: actions/upload-artifact@v4
        with:
          name: apple-artifacts
          path: |
            socialfeed-macos.dmg
            socialfeed-ios.ipa

  # ==========================================
  # 4. PUBLISH TO GITHUB RELEASES
  # ==========================================
  release:
    needs: [build-ubuntu, build-windows, build-macos-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Standardize Filenames
        run: |
          cd release_assets
          [ -f "app-release.apk" ] && mv app-release.apk socialfeed-android.apk
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/socialfeed-android.apk
            release_assets/socialfeed-linux.deb
            release_assets/SocialFeed-Setup.exe
            release_assets/socialfeed-macos.dmg
            release_assets/socialfeed-ios.ipa
